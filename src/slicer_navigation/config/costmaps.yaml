# RTK B RC2 ground-only sensor profile, with a fixed map reference frame.
global_costmap:
  global_frame: map
  robot_base_frame: base_link
  transform_tolerance: 0.30
  static_map: false
  rolling_window: true
  track_unknown_space: true
  always_send_full_costmap: true
  width: 60.0
  height: 60.0
  resolution: 0.10
  update_frequency: 2.5
  publish_frequency: 4.0
  footprint_padding: 0.0
  plugins: &layers
    - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}
  obstacle_layer:
    enabled: true
    observation_sources: scan
    combination_method: 1
    track_unknown_space: true
    footprint_clearing_enabled: true
    scan:
      topic: /scan
      data_type: LaserScan
      marking: true
      clearing: true
      obstacle_range: 16.0
      raytrace_range: 20.0
      min_obstacle_height: -0.05
      max_obstacle_height: 0.50
      inf_is_valid: true
      observation_persistence: 0.0
      expected_update_rate: 0.20
  inflation_layer:
    enabled: true
    inflation_radius: 0.45
    cost_scaling_factor: 4.5
local_costmap:
  global_frame: odom
  robot_base_frame: base_link
  transform_tolerance: 0.30
  static_map: false
  rolling_window: true
  track_unknown_space: true
  always_send_full_costmap: true
  width: 9.0
  height: 9.0
  resolution: 0.05
  update_frequency: 5.0
  publish_frequency: 4.0
  footprint_padding: 0.0
  plugins: *layers
  obstacle_layer:
    enabled: true
    observation_sources: scan
    combination_method: 1
    track_unknown_space: true
    footprint_clearing_enabled: true
    scan:
      topic: /scan
      data_type: LaserScan
      marking: true
      clearing: true
      obstacle_range: 4.5
      raytrace_range: 4.5
      min_obstacle_height: -0.05
      max_obstacle_height: 0.50
      inf_is_valid: true
      observation_persistence: 0.0
      expected_update_rate: 0.20
  inflation_layer:
    enabled: true
    inflation_radius: 0.25
    cost_scaling_factor: 4.5
