frequency: 30
sensor_timeout: 0.25
two_d_mode: true
publish_tf: true
# Wait for the matching local TF sample before composing map -> odom.
# Using a newer prediction and the latest older local sample causes yaw
# jitter that is amplified farther from the session origin.
transform_timeout: 0.08
transform_time_offset: 0.05
map_frame: map
odom_frame: odom
base_link_frame: base_link
world_frame: map
print_diagnostics: true
# The LIO projector establishes identical axes and origin for odom and map
# from the initial chassis pose. This map-frame observation is never derived
# from the published map -> odom transform.
odom0: /lio/map_reference
# Absolute LIO x/y anchors the no-GNSS profile. Both differential-LIO and
# wheel-dominant integration candidates failed the 064123 field replay.
odom0_config: [true, true, false, false, false, true, false, false, false, false, false, false, false, false, false]
odom0_differential: false
odom0_queue_size: 5
odom1: /ugv/internal/wheel_odom
odom1_config: [false, false, false, false, false, false, true, false, false, false, false, false, false, false, false]
odom1_queue_size: 10
pose0: /ugv/localization/gnss_xy
pose0_config: [true, true, false, false, false, false, false, false, false, false, false, false, false, false, false]
pose0_differential: false
pose0_queue_size: 10
pose0_rejection_threshold: 5.0
