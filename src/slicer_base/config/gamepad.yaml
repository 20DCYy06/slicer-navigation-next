# Linux joystick input and gears from the current vehicle site and manual tool.
device: /dev/input/by-id/usb-2563_USB_WirelessGamepad-joystick
throttle_axis: 1
steering_axis: 2
throttle_sign: -1
steering_sign: -1
dead_zone: 0.1
up_button: 7
down_button: 6
stop_button: 1
linear_min: 0.1
linear_max: 1.0
linear_step: 0.05
angular_min: 0.05
angular_max: 0.5
angular_step: 0.05
event_timeout_s: 0.25
